name: Emulator smoke test

# Boots real Android emulators (11, 13, 14), installs the debug APK, starts the server on the emulator
# and exercises the HTTP API end to end. Screenshots and logs are uploaded as artifacts.
on:
  push:
    branches: [main]
    paths: ["app/**", "tools/e2e/**", ".github/workflows/emulator.yml", "build.gradle.kts", "settings.gradle.kts"]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 33, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -n1)/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/e2e/smoke.sh app/build/outputs/apk/debug/app-debug.apk e2e-out

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api${{ matrix.api-level }}
          path: e2e-out/
          if-no-files-found: ignore
