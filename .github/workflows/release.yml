name: Release

# Push a tag like v1.0.0 to build a SIGNED release APK and publish it as gallery.apk on a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  actions: write    # re-run the landing page deploy afterwards

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode is the commit count, so it needs full history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK; accept licenses so Gradle can fetch platform 35 / build-tools.
      - name: Accept Android SDK licenses
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -n1)/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Run tools/generate-keystore.sh (see README, 'Signing')."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gallery-release.jks"
          echo "GALLERY_KEYSTORE_PATH=$RUNNER_TEMP/gallery-release.jks" >> "$GITHUB_ENV"
          echo "GALLERY_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GALLERY_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          GALLERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GALLERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GALLERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify the APK is signed
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/gallery.apk
          (cd dist && sha256sum gallery.apk > gallery.apk.sha256 && cat gallery.apk.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/gallery.apk dist/gallery.apk.sha256 \
            --title "Gallery ${GITHUB_REF_NAME}" --generate-notes --verify-tag

      # Releases created with GITHUB_TOKEN don't trigger other workflows, so refresh the landing page explicitly.
      - name: Refresh landing page (version + size)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
