name: Documentation screenshots

# Generates the screenshots used by the presentation: web dashboard (mock phone, fake data only)
# and real Android screens from an emulator. Run by hand; results are uploaded as artifacts.
on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Capture web screenshots
        run: node tools/shots/web.mjs shots/web
      - uses: actions/upload-artifact@v4
        with:
          name: shots-web
          path: shots/web/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -n1)/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/shots/android.sh app/build/outputs/apk/debug/app-debug.apk shots/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-android
          path: shots/android/
